name: APK yig'ish

on:
  push:
    branches: [odat-vidjet]
    paths-ignore: ['dist/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: APK yig'ish
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease > build.log 2>&1
          echo $? > status.txt
          exit 0

      - name: Natijani branchga saqlash
        run: |
          mkdir -p dist
          cp build.log status.txt dist/
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/Odatlarim.apk
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit -m "APK yig'ildi [skip ci]" || true
          git push

      - name: Yig'ish natijasi
        run: |
          tail -n 40 build.log
          exit "$(cat status.txt)"
